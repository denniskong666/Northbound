name: Fetch Unity Windows build module

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Unity module
        run: |
          curl --fail --location --retry 5 \
            --output UnitySetup-Windows-Mono-Support-for-Editor-6000.3.22f1.pkg \
            https://download.unity3d.com/download_unity/1c726e1fb402/MacEditorTargetInstaller/UnitySetup-Windows-Mono-Support-for-Editor-6000.3.22f1.pkg
          test -s UnitySetup-Windows-Mono-Support-for-Editor-6000.3.22f1.pkg

      - name: Upload temporary module artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-windows-mono-6000.3.22f1
          path: UnitySetup-Windows-Mono-Support-for-Editor-6000.3.22f1.pkg
          retention-days: 1
          compression-level: 0
